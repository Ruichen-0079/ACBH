name: v0.4 Relay-First CI

on:
  pull_request:
  push:
    branches:
      - rewrite/v0.4-relay-first-clean
      - integration/v0.4-pr68
      - packaging/v0.4-windows-installer-ui

permissions:
  contents: read

concurrency:
  group: v04-relay-first-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Coordinator dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Coordinator
        run: pnpm build:coordinator

      - name: Test Coordinator
        run: pnpm --filter @acbh/coordinator test

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Check Go formatting
        working-directory: agent
        shell: bash
        run: |
          gofmt -l . | tee gofmt-files.txt
          test ! -s gofmt-files.txt

      - name: Race-test bounded operation history
        if: runner.os == 'Linux'
        working-directory: agent
        run: go test -race ./internal/hobbyagent -run TestOperationHistory -count=1

      - name: Vet Agent
        working-directory: agent
        run: go vet ./...

      - name: Check patch whitespace
        run: git diff --check HEAD

  windows-package:
    name: Build Windows installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable ZIP and Setup EXE
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version "0.4.0-ci.${{ github.run_number }}"

      - name: Verify Windows package
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -OutputDirectory ./dist/windows -Version "0.4.0-ci.${{ github.run_number }}"

      - name: Test install, upgrade, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -SetupPath "./dist/windows/ACBH-0.4.0-ci.${{ github.run_number }}-windows-x64-setup.exe"

      - name: Upload package validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acbh-windows-package-${{ github.run_number }}
          path: dist/windows/*
          if-no-files-found: error
