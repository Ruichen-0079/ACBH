name: Apply PR 18 streaming transfer changes

on:
  push:
    branches:
      - codex/streaming-object-transfer

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          base64 --decode .github/pr18.patch.gz.b64 | gzip --decompress > /tmp/pr18.patch
          echo "b4560ebfe81cc6f475120901c67803df30fd15ab228be9bfa9d69cc912e5454f  /tmp/pr18.patch" | sha256sum --check
          git apply --check /tmp/pr18.patch
          git apply /tmp/pr18.patch
          rm .github/pr18.patch.gz.b64 .github/workflows/apply-pr18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add streaming object transfer"
          git push origin HEAD:codex/streaming-object-transfer
