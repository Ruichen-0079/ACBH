name: Apply PR 20 process manager changes

on:
  push:
    branches:
      - codex/minecraft-process-manager
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'codex/minecraft-process-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/minecraft-process-manager
      - name: Apply verified local files
        shell: bash
        run: |
          base64 --decode .github/pr20-files.tar.gz.b64 > /tmp/pr20-files.tar.gz
          echo "4e08de5c2b92101334b30dcd2460bd8995d854e1059d6f36e21a9fbe2d5c41d3  /tmp/pr20-files.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/pr20-files.tar.gz
          rm .github/pr20-files.tar.gz.b64 .github/workflows/apply-pr20.yml .github/pr20-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add local Minecraft process manager"
          git push origin HEAD:codex/minecraft-process-manager
