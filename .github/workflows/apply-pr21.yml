name: Apply PR 21 election and takeover changes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr21-payload-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'codex/election-takeover-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/election-takeover-demo
      - name: Apply verified local files
        shell: bash
        run: |
          cat .github/pr21-payload/part-* > /tmp/pr21-files.tar.gz.b64
          base64 --decode /tmp/pr21-files.tar.gz.b64 > /tmp/pr21-files.tar.gz
          echo "6c5a22df80f22811c46c53c45bf07d2d37d6f58fb29458f4fb63c7adf2924c56  /tmp/pr21-files.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/pr21-files.tar.gz
          rm -rf .github/pr21-payload .github/workflows/apply-pr21.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add election and takeover milestone"
          git push origin HEAD:codex/election-takeover-demo
