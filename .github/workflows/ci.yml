name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:coordinator
      - run: pnpm --filter @acbh/coordinator test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: agent
        run: go mod tidy
      - working-directory: agent
        run: go test ./... -count=1
      - working-directory: agent
        run: go test ./... -count=10
      - working-directory: agent
        run: go vet ./...
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify coordinator release bundle shell scripts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile=false
          tmp="$(mktemp -d)"
          VERSION=v0.4.0-alpha2-test GOOS=windows bash scripts/build-agent-release.sh
          tar -xzf dist/acbh-coordinator-linux-amd64-bundle.tar.gz -C "$tmp"
          bundle="$tmp/acbh-coordinator-linux-amd64-bundle"
          while IFS= read -r -d '' shfile; do
            if [ "$(head -c 3 "$shfile" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "BOM found in $shfile" >&2
              exit 1
            fi
            if grep -q $'\r' "$shfile"; then
              echo "CRLF found in $shfile" >&2
              exit 1
            fi
            bash -n "$shfile"
          done < <(find "$bundle" -type f -name '*.sh' -print0)
          shellcheck -x "$bundle"/scripts/*.sh "$bundle"/run-coordinator.sh

  vps-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: VPS upgrade integration tests
        run: bash scripts/test/acbh-vps-upgrade.test.sh
      - name: shellcheck VPS scripts
        working-directory: scripts
        run: |
          shellcheck -x -e SC2015 \
            acbh-vps-lib.sh \
            install-acbh-vps.sh \
            acbh-vps-upgrade.sh \
            acbh-vps-rollback.sh \
            acbh-vps-status.sh
