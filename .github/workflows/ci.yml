name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build:coordinator
      - run: pnpm --filter @acbh/coordinator test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: agent
        run: go mod tidy
      - working-directory: agent
        run: go test ./... -count=1
      - working-directory: agent
        run: go test ./... -count=10
      - working-directory: agent
        run: go vet ./...

  vps-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: VPS upgrade integration tests
        run: bash scripts/test/acbh-vps-upgrade.test.sh
      - name: shellcheck VPS scripts
        run: |
          shellcheck \
            scripts/install-acbh-vps.sh \
            scripts/acbh-vps-lib.sh \
            scripts/acbh-vps-upgrade.sh \
            scripts/acbh-vps-rollback.sh \
            scripts/acbh-vps-status.sh